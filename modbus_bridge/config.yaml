name: "Modbus Bridge"
version: "1.1.4"
slug: "modbus_addon"
description: "Modbus RTU → MQTT мост с веб-интерфейсом"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
init: false
startup: application
boot: auto
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:thermometer-lines
panel_title: Modbus Bridge
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "modbus_bridge"
  mqtt_password: "1111"
  modbus_port: "/dev/ttyUSB0"
  baudrate: 9600
schema:
  mqtt_host: "str"
  mqtt_port: "int"
  mqtt_user: "str"
  mqtt_password: "password"
  modbus_port: "str"
  baudrate: "int"
devices:
  - /dev/ttyUSB0:/dev/ttyUSB0:rwm
